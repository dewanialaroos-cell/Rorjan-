<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RORJAN — Luxury Redefined</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700;900&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
/* ============ RESET & BASE ============ */
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --gold: #d8ad55;
  --gold-light: #f0cb78;
  --gold-dark: #a67c2e;
  --bg: #080808;
  --bg-2: #101010;
  --border: #292929;
  --text: #fff;
  --text-dim: #888;
}

html { scroll-behavior: smooth; }

body {
  font-family: 'Inter', sans-serif;
  background: var(--bg);
  color: var(--text);
  overflow-x: hidden;
  cursor: none;
}

/* Custom Cursor */
.cursor-dot, .cursor-ring {
  position: fixed;
  pointer-events: none;
  z-index: 9999;
  border-radius: 50%;
  transition: transform 0.15s ease-out;
}
.cursor-dot {
  width: 6px; height: 6px;
  background: var(--gold);
  transform: translate(-50%, -50%);
}
.cursor-ring {
  width: 34px; height: 34px;
  border: 1.5px solid var(--gold);
  transform: translate(-50%, -50%);
  transition: transform 0.25s ease-out, width 0.3s, height 0.3s;
}
.cursor-ring.hover {
  width: 60px; height: 60px;
  background: rgba(216,173,85,0.1);
}
@media (max-width: 900px) {
  body { cursor: auto; }
  .cursor-dot, .cursor-ring { display: none; }
}

/* ============ LOADER ============ */
.loader {
  position: fixed; inset: 0;
  background: #050505;
  z-index: 10000;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  transition: opacity 0.8s, visibility 0.8s;
}
.loader.hide { opacity: 0; visibility: hidden; }
.loader-logo {
  font-family: 'Playfair Display', serif;
  font-size: 64px;
  color: var(--gold);
  letter-spacing: 12px;
  animation: fadeUp 1s ease;
}
.loader-crown {
  color: var(--gold);
  font-size: 28px;
  margin-bottom: 10px;
  animation: fadeUp 1s ease 0.2s backwards;
}
.loader-line {
  width: 200px; height: 1px;
  background: linear-gradient(90deg, transparent, var(--gold), transparent);
  margin-top: 30px;
  animation: expand 1.5s ease infinite;
}
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}
@keyframes expand {
  0%, 100% { width: 60px; opacity: 0.3; }
  50% { width: 260px; opacity: 1; }
}

/* ============ PARTICLES ============ */
.particles {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 1;
  overflow: hidden;
}
.particle {
  position: absolute;
  width: 2px; height: 2px;
  background: var(--gold);
  border-radius: 50%;
  opacity: 0;
  animation: float linear infinite;
  box-shadow: 0 0 6px var(--gold);
}
@keyframes float {
  0% { transform: translateY(100vh) scale(0); opacity: 0; }
  10% { opacity: 0.8; }
  90% { opacity: 0.8; }
  100% { transform: translateY(-100px) scale(1.5); opacity: 0; }
}

/* ============ HEADER ============ */
header {
  height: 82px;
  background: rgba(9,9,9,0.85);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 6%;
  position: sticky;
  top: 0;
  z-index: 100;
  transition: all 0.4s ease;
}
header.scrolled {
  height: 68px;
  background: rgba(5,5,5,0.95);
  box-shadow: 0 4px 30px rgba(216,173,85,0.08);
}

.logo {
  font-family: 'Playfair Display', serif;
  font-size: 34px;
  letter-spacing: 4px;
  color: var(--gold);
  cursor: none;
  position: relative;
  transition: all 0.3s;
}
.logo:hover { text-shadow: 0 0 20px rgba(216,173,85,0.7); }
.crown {
  display: block;
  text-align: center;
  font-size: 18px;
  margin-bottom: -4px;
  animation: crownFloat 3s ease-in-out infinite;
}
@keyframes crownFloat {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-3px); }
}

nav { display: flex; gap: 38px; }
nav a {
  color: #ddd;
  text-decoration: none;
  font-size: 13px;
  font-weight: 500;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  position: relative;
  padding: 6px 0;
  cursor: none;
  transition: color 0.3s;
}
nav a::after {
  content: '';
  position: absolute;
  bottom: 0; left: 50%;
  width: 0; height: 1.5px;
  background: var(--gold);
  transition: all 0.35s ease;
}
nav a:hover { color: var(--gold); }
nav a:hover::after { width: 100%; left: 0; }

.actions { display: flex; align-items: center; gap: 18px; }

.search-wrap {
  position: relative;
}
.search {
  width: 240px;
  padding: 11px 40px 11px 18px;
  border: 1px solid #333;
  border-radius: 25px;
  background: #0f0f0f;
  color: white;
  outline: none;
  font-size: 13px;
  transition: all 0.3s;
  cursor: none;
}
.search:focus {
  border-color: var(--gold);
  width: 280px;
  box-shadow: 0 0 20px rgba(216,173,85,0.2);
}
.search-icon {
  position: absolute;
  right: 14px; top: 50%;
  transform: translateY(-50%);
  color: var(--gold);
  font-size: 14px;
  pointer-events: none;
}

.icon-btn {
  font-size: 22px;
  cursor: none;
  position: relative;
  transition: transform 0.3s;
  display: inline-flex;
  align-items: center;
  gap: 4px;
  color: #fff;
}
.icon-btn:hover { transform: scale(1.15); color: var(--gold); }
.cart-badge {
  position: absolute;
  top: -8px; right: -10px;
  background: var(--gold);
  color: #000;
  font-size: 10px;
  font-weight: bold;
  min-width: 18px;
  height: 18px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 0 4px;
  transform: scale(0);
  transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
}
.cart-badge.show { transform: scale(1); }

/* ============ HERO ============ */
.hero {
  min-height: 100vh;
  display: flex;
  align-items: center;
  padding: 60px 8%;
  position: relative;
  overflow: hidden;
  background: #050505;
}
.hero-bg {
  position: absolute;
  inset: 0;
  background: url("https://images.unsplash.com/photo-1529139574466-a303027c1d8b?auto=format&fit=crop&w=1800&q=85") center/cover;
  opacity: 0.35;
  transform: scale(1.1);
  animation: slowZoom 20s ease-in-out infinite alternate;
}
@keyframes slowZoom {
  from { transform: scale(1.1); }
  to { transform: scale(1.2); }
}
.hero-overlay {
  position: absolute;
  inset: 0;
  background: linear-gradient(90deg, rgba(0,0,0,0.95) 0%, rgba(0,0,0,0.6) 50%, rgba(0,0,0,0.9) 100%);
}
.hero-glow {
  position: absolute;
  top: 50%; left: -20%;
  width: 600px; height: 600px;
  background: radial-gradient(circle, rgba(216,173,85,0.15), transparent 70%);
  transform: translateY(-50%);
  animation: pulseGlow 6s ease-in-out infinite;
}
@keyframes pulseGlow {
  0%, 100% { opacity: 0.6; transform: translateY(-50%) scale(1); }
  50% { opacity: 1; transform: translateY(-50%) scale(1.15); }
}

.hero-content {
  max-width: 640px;
  position: relative;
  z-index: 2;
}
.small-title {
  color: var(--gold);
  letter-spacing: 4px;
  font-size: 12px;
  font-weight: 500;
  margin-bottom: 24px;
  display: flex;
  align-items: center;
  gap: 14px;
  opacity: 0;
  animation: fadeUp 1s ease 0.4s forwards;
}
.small-title::before {
  content: '';
  width: 40px; height: 1px;
  background: var(--gold);
}
.hero h1 {
  font-family: 'Playfair Display', serif;
  font-size: 110px;
  font-weight: 900;
  letter-spacing: 12px;
  line-height: 1;
  margin-bottom: 24px;
  background: linear-gradient(135deg, #f0cb78 0%, #d8ad55 40%, #a67c2e 70%, #f0cb78 100%);
  background-size: 200% auto;
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  animation: shine 4s linear infinite, fadeUp 1s ease 0.6s backwards;
}
@keyframes shine {
  to { background-position: 200% center; }
}
.hero p {
  color: #ccc;
  line-height: 1.8;
  font-size: 17px;
  margin-bottom: 38px;
  font-weight: 300;
  opacity: 0;
  animation: fadeUp 1s ease 0.8s forwards;
}

.hero-buttons {
  display: flex;
  gap: 18px;
  opacity: 0;
  animation: fadeUp 1s ease 1s forwards;
}
.btn {
  background: linear-gradient(135deg, var(--gold) 0%, var(--gold-light) 100%);
  color: #080808;
  border: none;
  padding: 16px 38px;
  border-radius: 4px;
  font-weight: 600;
  font-size: 14px;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  cursor: none;
  position: relative;
  overflow: hidden;
  transition: all 0.4s;
  box-shadow: 0 8px 30px rgba(216,173,85,0.3);
}
.btn::before {
  content: '';
  position: absolute;
  top: 0; left: -100%;
  width: 100%; height: 100%;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.5), transparent);
  transition: left 0.6s;
}
.btn:hover::before { left: 100%; }
.btn:hover {
  transform: translateY(-3px);
  box-shadow: 0 15px 40px rgba(216,173,85,0.5);
}
.btn-outline {
  background: transparent;
  color: var(--gold);
  border: 1.5px solid var(--gold);
  box-shadow: none;
}
.btn-outline:hover {
  background: var(--gold);
  color: #000;
  box-shadow: 0 10px 30px rgba(216,173,85,0.4);
}

/* Floating shapes */
.hero-shape {
  position: absolute;
  border: 1px solid rgba(216,173,85,0.2);
  border-radius: 50%;
  animation: rotate 20s linear infinite;
}
.hero-shape.s1 { width: 300px; height: 300px; top: 15%; right: 8%; }
.hero-shape.s2 { width: 180px; height: 180px; bottom: 12%; right: 22%; animation-duration: 15s; animation-direction: reverse; }
.hero-shape.s3 { width: 100px; height: 100px; top: 30%; right: 30%; animation-duration: 10s; }
@keyframes rotate {
  to { transform: rotate(360deg); }
}

/* ============ MARQUEE ============ */
.marquee {
  padding: 22px 0;
  background: linear-gradient(90deg, #0a0a0a, #131313, #0a0a0a);
  border-top: 1px solid var(--border);
  border-bottom: 1px solid var(--border);
  overflow: hidden;
  position: relative;
}
.marquee-track {
  display: flex;
  gap: 60px;
  animation: scroll 30s linear infinite;
  white-space: nowrap;
}
.marquee-item {
  color: var(--gold);
  font-size: 13px;
  letter-spacing: 4px;
  text-transform: uppercase;
  font-weight: 500;
  display: flex;
  align-items: center;
  gap: 60px;
}
.marquee-item::after {
  content: '◆';
  color: var(--gold);
  font-size: 8px;
}
@keyframes scroll {
  to { transform: translateX(-50%); }
}

/* ============ CATEGORIES ============ */
.categories {
  padding: 80px 6%;
  display: grid;
  grid-template-columns: repeat(8, 1fr);
  gap: 15px;
}
.category {
  text-align: center;
  padding: 28px 12px;
  border: 1px solid var(--border);
  border-radius: 12px;
  background: linear-gradient(180deg, #101010, #0a0a0a);
  transition: all 0.4s ease;
  cursor: none;
  position: relative;
  overflow: hidden;
  opacity: 0;
  transform: translateY(30px);
}
.category.reveal {
  opacity: 1;
  transform: translateY(0);
}
.category::before {
  content: '';
  position: absolute;
  top: -50%; left: -50%;
  width: 200%; height: 200%;
  background: radial-gradient(circle, rgba(216,173,85,0.15), transparent 60%);
  opacity: 0;
  transition: opacity 0.4s;
}
.category:hover::before { opacity: 1; }
.category:hover {
  border-color: var(--gold);
  transform: translateY(-8px);
  box-shadow: 0 20px 40px rgba(216,173,85,0.15);
}
.cat-icon {
  font-size: 32px;
  margin-bottom: 14px;
  display: block;
  transition: transform 0.4s;
}
.category:hover .cat-icon { transform: scale(1.2) rotate(-8deg); }
.category h3 { font-size: 13px; margin-bottom: 6px; font-weight: 600; letter-spacing: 0.5px; }
.category p { color: var(--text-dim); font-size: 11px; }

/* ============ SECTION ============ */
.section { padding: 80px 6%; position: relative; z-index: 2; }
.section-title {
  display: flex;
  justify-content: space-between;
  align-items: flex-end;
  margin-bottom: 50px;
}
.section-title h2 {
  font-family: 'Playfair Display', serif;
  font-size: 42px;
  font-weight: 700;
  letter-spacing: 1px;
  position: relative;
}
.section-title h2::after {
  content: '';
  display: block;
  width: 60px; height: 2px;
  background: var(--gold);
  margin-top: 14px;
}
.view {
  color: var(--gold);
  text-decoration: none;
  font-size: 13px;
  letter-spacing: 2px;
  text-transform: uppercase;
  cursor: none;
  transition: all 0.3s;
  display: inline-flex;
  align-items: center;
  gap: 8px;
}
.view:hover { gap: 14px; color: var(--gold-light); }

/* ============ PRODUCTS ============ */
.products {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 28px;
}
.product {
  background: linear-gradient(180deg, #121212, #0a0a0a);
  border: 1px solid var(--border);
  border-radius: 14px;
  overflow: hidden;
  transition: all 0.5s cubic-bezier(0.25, 0.8, 0.25, 1);
  opacity: 0;
  transform: translateY(40px);
  cursor: none;
  position: relative;
}
.product.reveal {
  opacity: 1;
  transform: translateY(0);
}
.product::before {
  content: '';
  position: absolute;
  inset: -1px;
  border-radius: 14px;
  padding: 1px;
  background: linear-gradient(135deg, transparent, var(--gold), transparent);
  -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
  -webkit-mask-composite: xor;
          mask-composite: exclude;
  opacity: 0;
  transition: opacity 0.5s;
  pointer-events: none;
}
.product:hover::before { opacity: 1; }
.product:hover {
  transform: translateY(-12px) scale(1.02);
  box-shadow: 0 30px 60px rgba(0,0,0,0.6), 0 0 40px rgba(216,173,85,0.15);
}

.product-image {
  height: 320px;
  overflow: hidden;
  position: relative;
  background: #1a1a1a;
}
.product-image img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  transition: transform 0.8s cubic-bezier(0.25, 0.8, 0.25, 1);
}
.product:hover .product-image img { transform: scale(1.1); }

.product-badge {
  position: absolute;
  top: 15px; left: 15px;
  background: var(--gold);
  color: #000;
  padding: 5px 12px;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  border-radius: 3px;
  opacity: 0;
  transform: translateX(-10px);
  transition: all 0.4s;
}
.product:hover .product-badge { opacity: 1; transform: translateX(0); }

.product-overlay {
  position: absolute;
  inset: 0;
  background: linear-gradient(transparent 60%, rgba(0,0,0,0.8));
  opacity: 0;
  transition: opacity 0.4s;
  display: flex;
  align-items: flex-end;
  justify-content: center;
  padding: 20px;
}
.product:hover .product-overlay { opacity: 1; }

.quick-view {
  background: rgba(0,0,0,0.7);
  backdrop-filter: blur(10px);
  border: 1px solid var(--gold);
  color: var(--gold);
  padding: 10px 24px;
  font-size: 11px;
  letter-spacing: 2px;
  text-transform: uppercase;
  border-radius: 3px;
  cursor: none;
  transform: translateY(20px);
  transition: all 0.4s 0.1s;
}
.product:hover .quick-view { transform: translateY(0); }
.quick-view:hover { background: var(--gold); color: #000; }

.product-info { padding: 22px; }
.product h3 {
  font-size: 16px;
  margin-bottom: 10px;
  font-weight: 500;
  letter-spacing: 0.3px;
  transition: color 0.3s;
}
.product:hover h3 { color: var(--gold); }

.stars {
  color: #f5c542;
  font-size: 13px;
  margin-bottom: 14px;
  letter-spacing: 2px;
}
.price {
  color: #fff;
  font-weight: 600;
  font-size: 18px;
  margin-bottom: 16px;
}
.price .old-price {
  color: var(--text-dim);
  text-decoration: line-through;
  font-size: 13px;
  margin-left: 8px;
  font-weight: 400;
}

.cart-btn {
  width: 100%;
  padding: 13px;
  background: transparent;
  color: var(--gold);
  border: 1px solid var(--gold);
  border-radius: 5px;
  cursor: none;
  font-size: 12px;
  letter-spacing: 2px;
  text-transform: uppercase;
  font-weight: 600;
  transition: all 0.4s;
  position: relative;
  overflow: hidden;
}
.cart-btn::before {
  content: '';
  position: absolute;
  inset: 0;
  background: var(--gold);
  transform: scaleX(0);
  transform-origin: left;
  transition: transform 0.4s;
  z-index: -1;
}
.cart-btn:hover { color: #000; }
.cart-btn:hover::before { transform: scaleX(1); }

/* ============ PROMOS ============ */
.promos {
  padding: 0 6% 80px;
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 22px;
}
.promo {
  min-height: 240px;
  padding: 40px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  background-size: cover;
  background-position: center;
  border-radius: 12px;
  overflow: hidden;
  position: relative;
  cursor: none;
  transition: transform 0.5s;
  opacity: 0;
  transform: translateY(30px);
}
.promo.reveal { opacity: 1; transform: translateY(0); }
.promo:hover { transform: translateY(-6px); }
.promo::before {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(135deg, rgba(0,0,0,0.85), rgba(0,0,0,0.5));
  transition: all 0.5s;
}
.promo:hover::before { background: linear-gradient(135deg, rgba(0,0,0,0.7), rgba(0,0,0,0.3)); }
.promo-content { position: relative; z-index: 1; }
.promo h2 {
  font-family: 'Playfair Display', serif;
  font-size: 28px;
  margin-bottom: 10px;
  letter-spacing: 1px;
}
.promo p { color: #ccc; margin-bottom: 22px; font-size: 13px; font-weight: 300; }
.promo button {
  width: fit-content;
  padding: 12px 26px;
  background: transparent;
  color: white;
  border: 1px solid var(--gold);
  border-radius: 3px;
  font-size: 11px;
  letter-spacing: 2px;
  text-transform: uppercase;
  cursor: none;
  transition: all 0.4s;
}
.promo button:hover { background: var(--gold); color: #000; }

.fashion { background-image: url("https://images.unsplash.com/photo-1490578474895-699cd4e2cf59?auto=format&fit=crop&w=900&q=80"); }
.home { background-image: url("https://images.unsplash.com/photo-1600607687939-ce8a6c25118c?auto=format&fit=crop&w=900&q=80"); }
.electronics { background-image: url("https://images.unsplash.com/photo-1496181133206-80ce9b88a853?auto=format&fit=crop&w=900&q=80"); }

/* ============ FOOTER ============ */
footer {
  background: #050505;
  border-top: 1px solid var(--border);
  padding: 70px 6% 30px;
  position: relative;
  overflow: hidden;
}
footer::before {
  content: '';
  position: absolute;
  top: 0; left: 50%;
  width: 800px; height: 1px;
  background: linear-gradient(90deg, transparent, var(--gold), transparent);
  transform: translateX(-50%);
}
.footer-grid {
  display: grid;
  grid-template-columns: 2fr 1fr 1fr 1.5fr;
  gap: 50px;
}
.footer-logo {
  font-family: 'Playfair Display', serif;
  color: var(--gold);
  font-size: 32px;
  letter-spacing: 4px;
  margin-bottom: 20px;
}
footer p { color: var(--text-dim); font-size: 13px; line-height: 1.8; font-weight: 300; }
footer h3 {
  margin-bottom: 22px;
  color: #fff;
  font-size: 14px;
  letter-spacing: 2px;
  text-transform: uppercase;
  font-weight: 600;
}
footer a {
  display: block;
  color: var(--text-dim);
  text-decoration: none;
  margin-bottom: 12px;
  font-size: 13px;
  transition: all 0.3s;
  cursor: none;
  width: fit-content;
}
footer a:hover { color: var(--gold); transform: translateX(5px); }

.newsletter { display: flex; margin-top: 18px; border-radius: 4px; overflow: hidden; }
.newsletter input {
  flex: 1;
  padding: 13px;
  background: #111;
  border: 1px solid #333;
  color: white;
  outline: none;
  font-size: 13px;
}
.newsletter input:focus { border-color: var(--gold); }
.newsletter button {
  padding: 13px 20px;
  background: var(--gold);
  border: none;
  font-weight: 700;
  font-size: 12px;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  cursor: none;
  transition: background 0.3s;
}
.newsletter button:hover { background: var(--gold-light); }

.copyright {
  margin-top: 50px;
  padding-top: 25px;
  border-top: 1px solid #1a1a1a;
  text-align: center;
  color: #555;
  font-size: 12px;
  letter-spacing: 1px;
}

/* ============ CART MODAL ============ */
.cart-modal {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.85);
  backdrop-filter: blur(8px);
  z-index: 500;
  display: flex;
  justify-content: flex-end;
  opacity: 0;
  visibility: hidden;
  transition: all 0.4s;
}
.cart-modal.open { opacity: 1; visibility: visible; }

.cart-content {
  background: #0d0d0d;
  width: 440px;
  max-width: 92%;
  height: 100%;
  padding: 35px;
  overflow-y: auto;
  border-left: 1px solid var(--border);
  transform: translateX(100%);
  transition: transform 0.5s cubic-bezier(0.25, 0.8, 0.25, 1);
}
.cart-modal.open .cart-content { transform: translateX(0); }

.cart-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 30px;
  padding-bottom: 20px;
  border-bottom: 1px solid var(--border);
}
.cart-header h2 {
  font-family: 'Playfair Display', serif;
  color: var(--gold);
  font-size: 26px;
  letter-spacing: 1px;
}
.close-cart {
  font-size: 24px;
  cursor: none;
  color: var(--gold);
  width: 36px; height: 36px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 50%;
  transition: all 0.3s;
}
.close-cart:hover { background: rgba(216,173,85,0.15); transform: rotate(90deg); }

.cart-item {
  display: flex;
  justify-content: space-between;
  padding: 18px 0;
  border-bottom: 1px solid #1a1a1a;
  font-size: 14px;
  animation: slideIn 0.4s ease;
}
@keyframes slideIn {
  from { opacity: 0; transform: translateX(20px); }
  to { opacity: 1; transform: translateX(0); }
}
.cart-item-info strong { display: block; margin-bottom: 5px; font-weight: 500; }
.cart-item-info small { color: var(--text-dim); font-size: 12px; }
.cart-item-price { text-align: right; color: var(--gold); font-weight: 600; }
.remove-item {
  background: none;
  border: none;
  color: #666;
  cursor: none;
  font-size: 11px;
  margin-top: 6px;
  transition: color 0.3s;
  text-decoration: underline;
}
.remove-item:hover { color: #e74c3c; }

.cart-total {
  margin-top: 30px;
  padding-top: 25px;
  border-top: 2px solid var(--gold);
  display: flex;
  justify-content: space-between;
  font-size: 22px;
  font-weight: 700;
  color: var(--gold);
  font-family: 'Playfair Display', serif;
}

.checkout-btn {
  width: 100%;
  margin-top: 25px;
  padding: 16px;
}

.empty-cart {
  text-align: center;
  padding: 60px 20px;
  color: var(--text-dim);
  font-size: 14px;
}

/* ============ REVEAL ANIMATION ============ */
.reveal { transition: opacity 0.8s ease, transform 0.8s ease; }

/* ============ TOAST ============ */
.toast {
  position: fixed;
  bottom: 30px;
  right: 30px;
  background: linear-gradient(135deg, var(--gold), var(--gold-light));
  color: #000;
  padding: 16px 28px;
  border-radius: 8px;
  font-weight: 600;
  font-size: 14px;
  box-shadow: 0 20px 50px rgba(216,173,85,0.4);
  transform: translateY(200%);
  transition: transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
  z-index: 1000;
  display: flex;
  align-items: center;
  gap: 10px;
}
.toast.show { transform: translateY(0); }
